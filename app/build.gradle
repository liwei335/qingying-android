plugins { id 'com.android.application' }

def localSigning = new Properties()
def signingFile = rootProject.file('.signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { localSigning.load(it) }

android {
    namespace 'io.qingying.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.qingying.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        preview {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/preview.jks')
                storePassword localSigning['storePassword']
                keyAlias localSigning['keyAlias']
                keyPassword localSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.preview
        }
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', System.getProperty('robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2')
            systemProperty 'maven.repo.local', System.getProperty('maven.repo.local', new File(rootProject.projectDir, '.gradle/robolectric').absolutePath)
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
